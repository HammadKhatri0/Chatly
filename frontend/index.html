<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Realtime chat with friends, groups, files and voice messages." />
    <meta name="theme-color" content="#7551fb" />
    <title>Chatly</title>

    <!-- Inter carries the UI, Plus Jakarta Sans the headings. Both are variable fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Plus+Jakarta+Sans:wght@500..800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Paint the saved theme before first render so dark users never see a white flash.
      (() => {
        try {
          const saved = localStorage.getItem('chatly.theme');
          const dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch {
          /* private mode: React applies the theme on mount instead */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
